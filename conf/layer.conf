BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "myir-stm32mprt"
BBFILE_PATTERN_myir-stm32mprt := "^${LAYERDIR}/"
BBFILE_PRIORITY_myir-stm32mprt = "7"

LAYERSERIES_COMPAT_myir-stm32mprt = "scarthgap"
LAYERDEPENDS_myir-stm32mprt = "core openembedded-layer meta-python"

LAYERVERSION_myir-stm32mprt = "1"
ST_OSTL_COMPATIBILITY_VERSION_myir-stm32mprt = "6.2"
