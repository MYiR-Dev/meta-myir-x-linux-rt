#@TYPE: Machine
#@NAME: myd-ld25x-rt
#@DESCRIPTION: MYiR MYD-LD25X with the complete ST rtperf profile

# Keep the ST RT overrides consumed by the official X-LINUX-RT appends.
MACHINEOVERRIDES =. "stm32mp2rt:"
MACHINEOVERRIDES =. "stm32mprtcommon:"
MACHINEOVERRIDES =. "stm32mp2:"

require conf/machine/myd-ld25x.conf

# Match the official stm32mp2-rt-perf machine feature selection while
# retaining the MYIR board device trees and flash layout.
MACHINE_FEATURES += "rt"
MACHINE_FEATURES =+ "rtperf"

# Reserve CPU1 for the latency-sensitive application.  Full dynticks also
# moves timer, RCU, workqueue and generic kthread housekeeping to CPU0.
UBOOT_EXTLINUX_KERNEL_ARGS:append = " isolcpus=domain,managed_irq,1 nohz_full=1 rcu_nocbs=1 rcu_nocb_poll irqaffinity=0"

# The RT distribution uses the minimal OP-TEE boot scheme.
BOOTSCHEME_LABELS = "opteemin"
BOOTSCHEME_LABELS += "fastboot-opteemin"
